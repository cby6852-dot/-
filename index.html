<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <title>WARD ZERO | PC & Mobile</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08090c; }
    body { min-height: 100dvh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #app { height: 100%; height: 100dvh; display: flex; flex-direction: column; }
    header {
      flex: 0 0 auto; min-height: 48px; display: flex; align-items: center;
      justify-content: space-between; gap: 10px; padding: 6px 10px;
      background: #111318; border-bottom: 1px solid #30333a;
    }
    .brand { color: #f3f4f6; font-weight: 800; letter-spacing: .08em; font-size: 13px; white-space: nowrap; }
    .actions { display: flex; gap: 7px; }
    button {
      border: 1px solid #51545c; border-radius: 9px; color: #fff; background: #242730;
      padding: 9px 11px; min-height: 38px; font-size: 13px; font-weight: 650;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    button:active { background: #383c47; }
    #game { flex: 1 1 auto; width: 100%; min-height: 0; border: 0; background: #050505; }
    footer { flex: 0 0 auto; padding: 5px 10px calc(5px + env(safe-area-inset-bottom, 0px)); background: #111318; color: #b8bbc4; font-size: 11px; text-align: center; }
    #notice {
      display: none; position: fixed; z-index: 10; inset: 0; background: #08090c; color: #fff;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    #notice .panel { max-width: 460px; }
    #notice h1 { font-size: 22px; }
    #notice p { color: #c5c7ce; line-height: 1.6; }
    #notice a { color: #a9caff; }
    @media (max-width: 520px) {
      header { min-height: 44px; padding: 5px 7px; }
      .brand { font-size: 11px; letter-spacing: .03em; }
      button { padding: 8px 9px; min-height: 36px; font-size: 12px; }
      footer { font-size: 10px; }
    }
    @media (orientation: portrait) and (max-width: 700px) {
      footer::after { content: " · 게임이 작게 보이면 휴대폰을 가로로 돌려 보세요."; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">WARD ZERO</div>
      <div class="actions">
        <button id="open" type="button">원본 사이트</button>
        <button id="fullscreen" type="button">전체 화면</button>
      </div>
    </header>
    <iframe id="game"
      src="https://wardzero-sgjaeebp.manus.game/"
      title="WARD ZERO game"
      allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope"
      allowfullscreen>
    </iframe>
    <footer>PC와 모바일 화면에 맞춰 표시 · 인터넷 연결 필요</footer>
  </div>
  <div id="notice">
    <div class="panel">
      <h1>게임을 이 화면에서 열 수 없습니다.</h1>
      <p>원본 사이트가 외부 프레임 실행을 차단했거나 모바일 브라우저를 지원하지 않을 수 있습니다.</p>
      <p><a href="https://wardzero-sgjaeebp.manus.game/" target="_blank" rel="noopener">원본 게임을 새 창에서 열기</a></p>
      <p style="font-size:12px">이 파일은 원본 게임을 불러오는 반응형 실행 페이지이며, 게임 코드 자체를 포함하지 않습니다.</p>
    </div>
  </div>
  <script>
    const game = document.getElementById('game');
    document.getElementById('open').addEventListener('click', () => {
      window.open('https://wardzero-sgjaeebp.manus.game/', '_blank', 'noopener');
    });
    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        } else if (document.exitFullscreen) {
          await document.exitFullscreen();
        } else {
          window.open('https://wardzero-sgjaeebp.manus.game/', '_blank', 'noopener');
        }
      } catch (e) {
        window.open('https://wardzero-sgjaeebp.manus.game/', '_blank', 'noopener');
      }
    });
    game.addEventListener('error', () => {
      document.getElementById('notice').style.display = 'flex';
    });
  </script>
</body>
</html>
